plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nunz.paperspaceaccess'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nunz.paperspaceaccess'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    // HttpURLConnection can't send PATCH, which the Paperspace start/stop/restart endpoints require
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Runs the home-screen widget's commands and status checks in the background
    implementation 'androidx.work:work-runtime:2.10.0'
}
