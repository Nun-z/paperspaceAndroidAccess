plugins {
    id 'com.android.application'
}

// Release signing details live in the git-ignored keystore.properties at the project root
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.nunz.paperspaceaccess'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nunz.paperspaceaccess'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    // HttpURLConnection can't send PATCH, which the Paperspace start/stop/restart endpoints require
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Runs the home-screen widget's commands and status checks in the background
    implementation 'androidx.work:work-runtime:2.10.0'
}
